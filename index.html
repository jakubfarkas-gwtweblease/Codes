<style>
  :root{
    --em:#34D399; --em-lite:#6EE7B7; --em-deep:#047857;
    --grad-em:linear-gradient(135deg,#6EE7B7 0%,#34D399 50%,#047857 100%);
    --bg0:#070B0A; --bg1:#080C0B;
    --surface:linear-gradient(180deg, rgba(28,36,33,.72), rgba(15,20,18,.68));
    --text:#F2F5F3; --muted:#8FA39A; --muted-dim:#546059;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --danger:#FF6B5E; --danger-deep:#7A1F18;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button{-webkit-appearance:none;appearance:none;font:inherit;}
  button:focus-visible{outline:2px solid var(--em-lite);outline-offset:2px;border-radius:inherit;}
  html,body{margin:0;padding:0;height:100%;}
  html{background:var(--bg0);}
  body{
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.35;min-height:100%;
    background:
      radial-gradient(120% 70% at 20% -10%, rgba(52,211,153,.16), transparent 55%),
      radial-gradient(110% 65% at 100% 0%, rgba(110,231,183,.08), transparent 50%),
      radial-gradient(120% 75% at 0% 100%, rgba(52,211,153,.06), transparent 55%),
      linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 55%,#050807 100%);
    background-attachment:fixed;
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.3px;}

  header{
    position:sticky;top:0;z-index:20;padding:calc(16px + env(safe-area-inset-top)) 18px 14px;
    background:linear-gradient(180deg, rgba(9,13,12,.95), rgba(7,11,10,.88));
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid transparent;
    border-image:linear-gradient(90deg,transparent,rgba(52,211,153,.5),transparent) 1;
    box-shadow:0 10px 34px rgba(0,0,0,.5);
    display:flex;align-items:center;gap:12px;
  }
  .mark{width:42px;height:42px;border-radius:13px;flex:none;overflow:hidden;background:var(--grad-em);
    box-shadow:0 8px 20px rgba(52,211,153,.4), inset 0 1px 0 rgba(255,255,255,.3);}
  .mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .htext{flex:1;min-width:0;}
  h1{margin:0;font-size:18px;font-weight:800;letter-spacing:1px;line-height:1.15;
    background:linear-gradient(180deg,#FFFFFF,#CDE9DE);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

  .wrap{max-width:600px;margin:0 auto;padding:18px 16px calc(104px + env(safe-area-inset-bottom));}

  .empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:14px;}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:20px;
    padding:16px;margin-bottom:14px;position:relative;overflow:hidden;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 10px 26px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    animation:rise .4s cubic-bezier(.22,1,.36,1) both;
  }
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .avatar{flex:none;width:44px;height:44px;border-radius:13px;background:var(--grad-em);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#052E20;
    box-shadow:0 4px 14px rgba(52,211,153,.3);}
  .card-name{flex:1;min-width:0;}
  .card-name .full{font-size:16.5px;font-weight:800;line-height:1.2;}
  .card-idx{font-size:10.5px;color:var(--muted-dim);font-weight:700;letter-spacing:1px;margin-top:1px;}
  .card-actions{display:flex;gap:7px;flex:none;}
  .act-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);
    color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    transition:background .15s,color .15s,transform .12s,border-color .15s;}
  .act-btn svg{width:16px;height:16px;fill:currentColor;}
  .act-btn:active{transform:scale(.9);}
  .act-btn.trash:active{background:rgba(255,107,94,.16);color:var(--danger);border-color:rgba(255,107,94,.4);}
  .act-btn.restore:active{background:rgba(52,211,153,.16);color:var(--em-lite);border-color:rgba(52,211,153,.4);}
  .act-btn.perm:active{background:rgba(255,107,94,.16);color:var(--danger);border-color:rgba(255,107,94,.4);}

  .field-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);}
  .field-row:first-of-type{border-top:1px solid var(--line);}
  .field-main{flex:1;min-width:0;}
  .field-label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted-dim);font-weight:800;}
  .field-value{font-size:16px;color:var(--text);margin-top:2px;white-space:normal;word-break:break-word;font-weight:600;}

  .copy-btn{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid rgba(52,211,153,.3);
    background:rgba(52,211,153,.1);color:var(--em-lite);display:flex;align-items:center;justify-content:center;
    cursor:pointer;padding:0;transition:background .18s,border-color .18s,transform .12s,box-shadow .2s;}
  .copy-btn svg{width:20px;height:20px;fill:currentColor;}
  .copy-btn:active{transform:scale(.9);}
  .copy-btn.copied{background:var(--grad-em);color:#052E20;border-color:transparent;box-shadow:0 6px 18px rgba(52,211,153,.5);}

  .card.inactive{opacity:.52;}
  .card.inactive .copy-btn{background:rgba(255,255,255,.05);border-color:var(--line-2);color:var(--muted);}
  .card.inactive .avatar{background:#1C221F;color:var(--muted);}

  /* floating transparent bottom nav */
  nav.tabbar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));
    z-index:30;display:flex;gap:4px;padding:5px;border-radius:999px;
    background:rgba(15,22,19,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);box-shadow:0 14px 36px rgba(0,0,0,.55);
  }
  nav.tabbar button{border:none;background:transparent;color:var(--muted);padding:12px 20px;border-radius:999px;
    font-size:13.5px;font-weight:700;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap;}
  nav.tabbar button.active{background:var(--grad-em);color:#052E20;box-shadow:0 6px 18px rgba(52,211,153,.35);}

  .overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;
    padding:24px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
  .overlay.show{display:flex;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal{background:linear-gradient(180deg,#141C19,#0E1512);border:1px solid var(--line-2);border-radius:22px;padding:24px;
    max-width:320px;width:100%;text-align:center;animation:pop .32s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 30px 80px rgba(0,0,0,.6);}
  @keyframes pop{from{transform:scale(.88);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h2{margin:0 0 6px;font-size:17px;font-weight:800;}
  .modal p{margin:0 0 20px;font-size:13.5px;color:var(--muted);}
  .modal .btns{display:flex;gap:10px;}
  .modal button{flex:1;border-radius:999px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;border:none;}
  .btn-yes{background:linear-gradient(135deg,#FF8A80,var(--danger));color:#2A0806;}
  .btn-no{background:transparent;border:1px solid var(--line-2);color:var(--text);}

  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>

function stripDiacritics(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function randPassword(){
  const chars="abcdefghijklmnopqrstuvwxyz0123456789";
  let s=""; for(let i=0;i<10;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function makeIdentity(){
  const isMale = Math.random()<0.5;
  const firstName = isMale?pick(MALE_FIRST):pick(FEMALE_FIRST);
  const lastName = isMale?pick(MALE_LAST):pick(FEMALE_LAST);
  const emailUser = stripDiacritics(firstName).toLowerCase().replace(/[^a-z]/g,"")+"."+
                     stripDiacritics(lastName).toLowerCase().replace(/[^a-z]/g,"")+
                     String(Math.floor(Math.random()*90+10));
  return {
    id: uid(), firstName, lastName,
    phone: "0900 000 000",
    password: randPassword(),
    email: emailUser+"@example.com",
    active: true
  };
}

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ const d=JSON.parse(raw); if(Array.isArray(d) && d.length) return d; }
  }catch(e){}
  return Array.from({length:50}, makeIdentity);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(cards)); }catch(e){ alert("Nepodarilo sa uložiť zmeny."); } }

let cards = load();
save();
let tab = "active";

{
  const iconHref=document.getElementById("appIconLink");
  const markImg=document.getElementById("markImg");
  if(iconHref && markImg) markImg.src = iconHref.getAttribute("href");
}

const listEl=document.getElementById("list");
const emptyEl=document.getElementById("emptyMsg");
const headerSub=document.getElementById("headerSub");

const FIELDS = [
  {key:"firstName", label:"Meno"},
  {key:"lastName",  label:"Priezvisko"},
  {key:"phone",     label:"Číslo", mono:true},
  {key:"password",  label:"Heslo", mono:true},
  {key:"email",     label:"Email", mono:true},
];

function copyIcon(){ return '<path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/>'; }
function checkIcon(){ return '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>'; }
function trashIcon(){ return '<path d="M9 3v1H4v2h16V4h-5V3H9zM6 8v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8H6zm3 3h2v8H9v-8zm4 0h2v8h-2v-8z"/>'; }
function restoreIcon(){ return '<path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>'; }

function initials(c){ return (c.firstName[0]||"")+(c.lastName[0]||""); }

function cardHTML(c, i){
  const rows = FIELDS.map(f=>`
    <div class="field-row">
      <div class="field-main">
        <div class="field-label">${f.label}</div>
        <div class="field-value${f.mono?' mono':''}">${c[f.key]}</div>
      </div>
      <button type="button" class="copy-btn" data-copy="${c.id}" data-field="${f.key}" aria-label="Kopírovať ${f.label}">
        <svg viewBox="0 0 24 24">${copyIcon()}</svg>
      </button>
    </div>`).join("");

  const actions = c.active
    ? `<button type="button" class="act-btn trash" data-used="${c.id}" aria-label="Presunúť medzi neaktívne">
         <svg viewBox="0 0 24 24">${trashIcon()}</svg></button>`
    : `<button type="button" class="act-btn restore" data-restore="${c.id}" aria-label="Vrátiť medzi aktívne">
         <svg viewBox="0 0 24 24">${restoreIcon()}</svg></button>
       <button type="button" class="act-btn perm" data-perm="${c.id}" aria-label="Zmazať natrvalo">
         <svg viewBox="0 0 24 24">${trashIcon()}</svg></button>`;

  return `<div class="card${c.active?'':' inactive'}" data-card="${c.id}">
    <div class="card-head">
      <div class="avatar">${initials(c)}</div>
      <div class="card-name">
        <div class="full">${c.firstName} ${c.lastName}</div>
        <div class="card-idx">KARTA #${i+1}</div>
      </div>
      <div class="card-actions">${actions}</div>
    </div>
    ${rows}
  </div>`;
}

function render(){
  const filtered = cards.filter(c=>tab==="active"?c.active:!c.active);
  document.querySelectorAll("nav.tabbar button").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  const activeCount = cards.filter(c=>c.active).length;
  const inactiveCount = cards.length-activeCount;
  document.querySelector('[data-tab="active"]').textContent = `Aktívne (${activeCount})`;
  document.querySelector('[data-tab="inactive"]').textContent = `Neaktívne (${inactiveCount})`;
  headerSub.textContent = `${cards.length} kariet spolu · ${activeCount} aktívnych`;

  if(filtered.length===0){
    listEl.innerHTML="";
    emptyEl.style.display="block";
    emptyEl.textContent = tab==="active" ? "Žiadne aktívne karty. Všetko je použité." : "Zatiaľ nič nie je v neaktívnych.";
    return;
  }
  emptyEl.style.display="none";
  listEl.innerHTML = filtered.map((c)=>cardHTML(c, cards.indexOf(c))).join("");
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}

listEl.addEventListener("click", async e=>{
  const copyBtn=e.target.closest("[data-copy]");
  if(copyBtn){
    const card=cards.find(c=>c.id===copyBtn.dataset.copy);
    if(card){
      const ok=await copyText(card[copyBtn.dataset.field]);
      if(ok){
        copyBtn.classList.add("copied");
        copyBtn.innerHTML=`<svg viewBox="0 0 24 24">${checkIcon()}</svg>`;
        setTimeout(()=>{
          copyBtn.classList.remove("copied");
          copyBtn.innerHTML=`<svg viewBox="0 0 24 24">${copyIcon()}</svg>`;
        }, 1100);
      }
    }
    return;
  }
  const usedBtn=e.target.closest("[data-used]");
  if(usedBtn){
    const card=cards.find(c=>c.id===usedBtn.dataset.used);
    if(card){ card.active=false; save(); render(); }
    return;
  }
  const restoreBtn=e.target.closest("[data-restore]");
  if(restoreBtn){
    const card=cards.find(c=>c.id===restoreBtn.dataset.restore);
    if(card){ card.active=true; save(); render(); }
    return;
  }
  const permBtn=e.target.closest("[data-perm]");
  if(permBtn){
    document.getElementById("delOverlay").dataset.target=permBtn.dataset.perm;
    document.getElementById("delOverlay").classList.add("show");
    return;
  }
});

document.getElementById("delNo").addEventListener("click", ()=>document.getElementById("delOverlay").classList.remove("show"));
document.getElementById("delYes").addEventListener("click", ()=>{
  const id=document.getElementById("delOverlay").dataset.target;
  cards = cards.filter(c=>c.id!==id);
  save();
  document.getElementById("delOverlay").classList.remove("show");
  render();
});
document.getElementById("delOverlay").addEventListener("click", e=>{
  if(e.target.id==="delOverlay") e.currentTarget.classList.remove("show");
});

document.getElementById("tabbar").addEventListener("click", e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  tab=b.dataset.tab; render();
});

render();
</script>
</body>
</html>
