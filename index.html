<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karty">
<title>Karty</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root{
    --bg:#000000;
    --surface:#1C1C1E;
    --surface-2:#2C2C2E;
    --sep:rgba(255,255,255,.09);
    --text:#F5F5F7;
    --text-2:#98989F;
    --text-3:#636366;
    --green:#30D158;
    --red:#FF453A;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  button{-webkit-appearance:none;appearance:none;font:inherit;border:none;background:none;cursor:pointer;color:inherit;}
  button:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:12px;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:16px;letter-spacing:.2px;}
  .num{font-variant-numeric:tabular-nums;}

  header{
    position:sticky;top:0;z-index:20;
    padding:calc(10px + env(safe-area-inset-top)) 20px 12px;
    background:rgba(0,0,0,.82);
    backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:.5px solid var(--sep);
  }
  h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.5px;}
  .sub{font-size:13px;color:var(--text-2);margin-top:2px;}

  .seg{display:flex;gap:2px;margin-top:12px;padding:2px;border-radius:9px;background:rgba(118,118,128,.24);}
  .seg button{flex:1;padding:7px 0;border-radius:7px;font-size:13px;font-weight:600;color:var(--text);
    transition:background .18s;}
  .seg button.active{background:var(--surface-2);box-shadow:0 3px 8px rgba(0,0,0,.35);}

  .wrap{max-width:560px;margin:0 auto;padding:8px 16px calc(40px + env(safe-area-inset-bottom));}
  .empty{text-align:center;color:var(--text-2);padding:72px 24px;font-size:15px;}

  /* skupina */
  .sec{margin-top:28px;}
  .sec-head{display:flex;align-items:center;gap:14px;padding:0 4px 10px;}
  .sec-num{flex:none;font-size:40px;font-weight:700;line-height:1;letter-spacing:-1.5px;color:var(--green);
    font-variant-numeric:tabular-nums;}
  .sec-meta{flex:1;min-width:0;}
  .sec-title{font-size:17px;font-weight:600;letter-spacing:-.2px;}
  .sec-sub{font-size:13px;color:var(--text-3);margin-top:1px;}
  .sec-btn{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);
    font-size:14px;font-weight:500;color:var(--green);transition:opacity .15s;}
  .sec-btn:active{opacity:.5;}
  .sec-btn.danger{color:var(--red);}

  .card{background:var(--surface);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .card.inactive{opacity:.45;}

  .card-top{display:flex;align-items:center;gap:12px;padding-bottom:12px;}
  .card-name{flex:1;min-width:0;}
  .name{font-size:17px;font-weight:600;letter-spacing:-.2px;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
  .card-meta{font-size:12.5px;color:var(--text-3);margin-top:2px;}
  .card-meta b{color:var(--text-2);font-weight:600;}
  .icon-btn{flex:none;width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    color:var(--text-3);transition:opacity .15s,color .15s;}
  .icon-btn svg{width:17px;height:17px;fill:currentColor;}
  .icon-btn:active{opacity:.45;}
  .icon-btn.danger:active{color:var(--red);}
  .icon-btn.ok:active{color:var(--green);}

  .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:.5px solid var(--sep);}
  .row-main{flex:1;min-width:0;}
  .row-label{font-size:12px;color:var(--text-3);margin-bottom:2px;}
  .row-value{word-break:break-all;}
  .copy{flex:none;width:34px;height:34px;border-radius:999px;background:var(--surface-2);color:var(--text-2);
    display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .15s;}
  .copy svg{width:16px;height:16px;fill:currentColor;}
  .copy:active{transform:scale(.9);}
  .copy.copied{background:var(--green);color:#062E12;}

  .overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;
    padding:32px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
  .overlay.show{display:flex;}
  .modal{background:#26262A;border-radius:20px;padding:20px;max-width:280px;width:100%;text-align:center;
    animation:pop .22s cubic-bezier(.32,.9,.4,1);}
  @keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h2{margin:0 0 6px;font-size:17px;font-weight:600;}
  .modal p{margin:0 0 18px;font-size:13.5px;color:var(--text-2);line-height:1.4;}
  .modal .btns{display:flex;gap:8px;}
  .modal button{flex:1;border-radius:12px;padding:12px;font-size:15px;font-weight:600;}
  .btn-no{background:rgba(118,118,128,.28);color:var(--text);}
  .btn-yes{background:var(--red);color:#fff;}

  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>

<header>
  <h1>Karty</h1>
  <div class="sub" id="headerSub"></div>
  <div class="seg" id="tabbar">
    <button type="button" data-tab="active">Aktívne</button>
    <button type="button" data-tab="inactive">Neaktívne</button>
  </div>
</header>

<div class="wrap">
  <div id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;"></div>
</div>

<div class="overlay" id="delOverlay">
  <div class="modal">
    <h2 id="delTitle"></h2>
    <p id="delText"></p>
    <div class="btns">
      <button class="btn-no" id="delNo">Zrušiť</button>
      <button class="btn-yes" id="delYes">Zmazať</button>
    </div>
  </div>
</div>

<script>
const KEY = "karty-v2";
const GROUP_SIZE = 4;
const TOTAL = 64;

const MALE_FIRST = ["Ján","Peter","Martin","Michal","Tomáš","Jakub","Lukáš","Marek","Andrej","Filip","Matej","Dominik","Patrik","Erik","Adam","Šimon","Daniel","Roman","Milan","Pavol","Richard","Boris","Radovan","Vladimír","Norbert","Oliver","Samuel","Stanislav","Miroslav","Ladislav"];
const FEMALE_FIRST = ["Mária","Anna","Zuzana","Katarína","Lucia","Veronika","Simona","Natália","Barbora","Petra","Monika","Jana","Michaela","Lenka","Kristína","Ivana","Silvia","Denisa","Alexandra","Viktória","Tatiana","Emília","Nikola","Dominika","Adriána","Renáta","Soňa","Vladimíra","Klaudia","Miroslava"];
const MALE_LAST = ["Novák","Kováč","Varga","Baláž","Šimko","Kollár","Polák","Kučera","Kráľ","Danko","Kmeť","Sokol","Pavlík","Hraško","Bartoš","Marek","Krajčí","Urban","Petráš","Švec","Horváth","Molnár","Sedlák","Beňo","Hudec","Michalík","Antal","Zeman","Lipták","Bezák"];

function feminine(sur){
  if(sur.endsWith("ý")||sur.endsWith("y")) return sur.slice(0,-1)+"á";
  if(sur.endsWith("ť")) return sur.slice(0,-1)+"ťová";
  if(sur.endsWith("ľ")) return sur.slice(0,-1)+"ľová";
  if(sur.endsWith("č")) return sur.slice(0,-1)+"čová";
  if(sur.endsWith("š")) return sur.slice(0,-1)+"šová";
  if(sur.endsWith("ž")) return sur.slice(0,-1)+"žová";
  return sur+"ová";
}
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function stripDiacritics(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,""); }

function randPassword(){
  const letters="abcdefghijkmnopqrstuvwxyz", digits="23456789", all=letters+digits;
  let s = letters[Math.floor(Math.random()*letters.length)] + digits[Math.floor(Math.random()*digits.length)];
  for(let i=0;i<8;i++) s+=all[Math.floor(Math.random()*all.length)];
  return s.split("").sort(()=>Math.random()-0.5).join("");
}

function makeIdentity(group, usedEmails){
  const isMale = Math.random()<0.5;
  const firstName = isMale?pick(MALE_FIRST):pick(FEMALE_FIRST);
  const base = pick(MALE_LAST);
  const lastName = isMale?base:feminine(base);
  const clean = s => stripDiacritics(s).toLowerCase().replace(/[^a-z]/g,"");
  let email;
  do{ email = clean(firstName)+"."+clean(lastName)+String(Math.floor(Math.random()*900+100))+"@example.com"; }
  while(usedEmails.has(email));
  usedEmails.add(email);
  return { id: uid(), group, firstName, lastName, email, password: randPassword(), active: true };
}
function buildAll(){
  const used=new Set(), out=[];
  for(let i=0;i<TOTAL;i++) out.push(makeIdentity(Math.floor(i/GROUP_SIZE)+1, used));
  return out;
}
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ const d=JSON.parse(raw); if(Array.isArray(d)&&d.length) return d; } }catch(e){}
  return buildAll();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(cards)); }catch(e){ alert("Nepodarilo sa uložiť zmeny."); } }

let cards = load();
save();
let tab = "active";

const listEl=document.getElementById("list");
const emptyEl=document.getElementById("emptyMsg");
const headerSub=document.getElementById("headerSub");
const overlay=document.getElementById("delOverlay");

const FIELDS = [
  {key:"email",    label:"Email"},
  {key:"password", label:"Heslo"},
];

const copyIcon='<path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/>';
const checkIcon='<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>';
const trashIcon='<path d="M9 3v1H4v2h16V4h-5V3H9zM6 8v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8H6zm3 3h2v8H9v-8zm4 0h2v8h-2v-8z"/>';
const restoreIcon='<path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>';

function posInGroup(c){ return cards.filter(x=>x.group===c.group).indexOf(c)+1; }
function plural(n){ return n===1?"karta":(n<5?"karty":"kariet"); }

function cardHTML(c){
  const rows = FIELDS.map(f=>`
    <div class="row">
      <div class="row-main">
        <div class="row-label">${f.label}</div>
        <div class="row-value mono">${c[f.key]}</div>
      </div>
      <button type="button" class="copy" data-copy="${c.id}" data-field="${f.key}" aria-label="Kopírovať ${f.label}">
        <svg viewBox="0 0 24 24">${copyIcon}</svg>
      </button>
    </div>`).join("");

  const actions = c.active
    ? `<button type="button" class="icon-btn danger" data-used="${c.id}" aria-label="Presunúť medzi neaktívne">
         <svg viewBox="0 0 24 24">${trashIcon}</svg></button>`
    : `<button type="button" class="icon-btn ok" data-restore="${c.id}" aria-label="Vrátiť medzi aktívne">
         <svg viewBox="0 0 24 24">${restoreIcon}</svg></button>
       <button type="button" class="icon-btn danger" data-perm="${c.id}" aria-label="Zmazať natrvalo">
         <svg viewBox="0 0 24 24">${trashIcon}</svg></button>`;

  return `<div class="card${c.active?"":" inactive"}">
    <div class="card-top">
      <div class="card-name">
        <div class="name">${c.firstName} ${c.lastName}</div>
        <div class="card-meta num">Skupina <b>${c.group}</b> · karta ${posInGroup(c)}</div>
      </div>
      ${actions}
    </div>
    ${rows}
  </div>`;
}

function sectionHTML(g, list){
  const btns = tab==="active"
    ? `<button type="button" class="sec-btn" data-gused="${g}">Použiť</button>`
    : `<button type="button" class="sec-btn" data-grestore="${g}">Vrátiť</button>
       <button type="button" class="sec-btn danger" data-gperm="${g}">Zmazať</button>`;
  return `<section class="sec">
    <div class="sec-head">
      <div class="sec-num">${g}</div>
      <div class="sec-meta">
        <div class="sec-title">Skupina ${g}</div>
        <div class="sec-sub">${list.length} ${plural(list.length)}</div>
      </div>
      ${btns}
    </div>
    ${list.map(cardHTML).join("")}
  </section>`;
}

function render(){
  const filtered = cards.filter(c=>tab==="active"?c.active:!c.active);
  document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("active", b.dataset.tab===tab));
  const activeCount = cards.filter(c=>c.active).length;
  const groups = new Set(cards.map(c=>c.group)).size;
  document.querySelector('[data-tab="active"]').textContent = `Aktívne ${activeCount}`;
  document.querySelector('[data-tab="inactive"]').textContent = `Neaktívne ${cards.length-activeCount}`;
  headerSub.textContent = `${cards.length} ${plural(cards.length)} v ${groups} skupinách`;

  if(filtered.length===0){
    listEl.innerHTML="";
    emptyEl.style.display="block";
    emptyEl.textContent = tab==="active" ? "Všetky karty sú použité." : "Tu zatiaľ nič nie je.";
    return;
  }
  emptyEl.style.display="none";
  const byGroup=new Map();
  filtered.forEach(c=>{ if(!byGroup.has(c.group)) byGroup.set(c.group,[]); byGroup.get(c.group).push(c); });
  listEl.innerHTML=[...byGroup.keys()].sort((a,b)=>a-b).map(g=>sectionHTML(g, byGroup.get(g))).join("");
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{
      const ta=document.createElement("textarea");
      ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
      return true;
    }catch(e2){ return false; }
  }
}

function ask(kind, id, title, text){
  overlay.dataset.kind=kind; overlay.dataset.target=id;
  document.getElementById("delTitle").textContent=title;
  document.getElementById("delText").textContent=text;
  overlay.classList.add("show");
}

listEl.addEventListener("click", async e=>{
  const copyBtn=e.target.closest("[data-copy]");
  if(copyBtn){
    const card=cards.find(c=>c.id===copyBtn.dataset.copy);
    if(card && await copyText(card[copyBtn.dataset.field])){
      copyBtn.classList.add("copied");
      copyBtn.innerHTML=`<svg viewBox="0 0 24 24">${checkIcon}</svg>`;
      setTimeout(()=>{ copyBtn.classList.remove("copied"); copyBtn.innerHTML=`<svg viewBox="0 0 24 24">${copyIcon}</svg>`; },1100);
    }
    return;
  }
  const usedBtn=e.target.closest("[data-used]");
  if(usedBtn){ const c=cards.find(x=>x.id===usedBtn.dataset.used); if(c){ c.active=false; save(); render(); } return; }

  const restoreBtn=e.target.closest("[data-restore]");
  if(restoreBtn){ const c=cards.find(x=>x.id===restoreBtn.dataset.restore); if(c){ c.active=true; save(); render(); } return; }

  const permBtn=e.target.closest("[data-perm]");
  if(permBtn){ ask("card", permBtn.dataset.perm, "Zmazať kartu?", "Karta sa odstráni natrvalo."); return; }

  const gUsed=e.target.closest("[data-gused]");
  if(gUsed){ const g=Number(gUsed.dataset.gused); cards.forEach(c=>{ if(c.group===g) c.active=false; }); save(); render(); return; }

  const gRestore=e.target.closest("[data-grestore]");
  if(gRestore){ const g=Number(gRestore.dataset.grestore); cards.forEach(c=>{ if(c.group===g) c.active=true; }); save(); render(); return; }

  const gPerm=e.target.closest("[data-gperm]");
  if(gPerm){
    const g=Number(gPerm.dataset.gperm);
    const n=cards.filter(c=>c.group===g && !c.active).length;
    ask("group", String(g), `Zmazať skupinu ${g}?`, `Odstráni sa ${n} ${plural(n)} natrvalo.`);
    return;
  }
});

document.getElementById("delNo").addEventListener("click", ()=>overlay.classList.remove("show"));
document.getElementById("delYes").addEventListener("click", ()=>{
  const kind=overlay.dataset.kind, target=overlay.dataset.target;
  if(kind==="card") cards=cards.filter(c=>c.id!==target);
  if(kind==="group"){ const g=Number(target); cards=cards.filter(c=>!(c.group===g && !c.active)); }
  save(); overlay.classList.remove("show"); render();
});
overlay.addEventListener("click", e=>{ if(e.target.id==="delOverlay") e.currentTarget.classList.remove("show"); });

document.getElementById("tabbar").addEventListener("click", e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  tab=b.dataset.tab; render(); window.scrollTo({top:0});
});

render();
</script>
</body>
</html>
